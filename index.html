<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- OS DOIS FAVICONS SÃO O MESMO TILE ESMERALDA, e agora isso é verdade.
         Em 16 px o desenho vazado desaparece: a onda de buzina tem 0,68 px de
         traço e some. A conclusão já estava escrita aqui, mas aplicada só no
         .ico — o formato de RESERVA. O .svg, que é o que o Chrome usa, ficou
         vazado por anos. Agora os dois saem da mesma projeção do gerador.
         Tile não precisa trocar de cor em aba escura: quadrado de cor sólida
         tem contraste contra as duas, então a media query saiu junto. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="alternate icon" href="/brand/favicon.ico" sizes="16x16 32x32 48x48" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1F5F3F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alô Buzinou" />
    <meta
      name="description"
      content="Onde a perua está agora, o que o motorista avisou e a mensalidade em dia — num lugar só."
    />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <!-- Preview do link. O convite do motorista circula por WhatsApp: sem
         estas tags o pai recebe um retângulo cinza no lugar da marca. -->
    <!--
      og:url É OBRIGATÓRIA, e a ausência dela era o motivo do link do WhatsApp
      aparecer pelado: só o domínio repetido, sem título, sem texto e sem
      imagem.

      O protocolo Open Graph exige quatro tags — og:title, og:type, og:image e
      og:url. As outras três estavam aqui; sem a quarta, vários robôs (o do
      WhatsApp entre eles) desistem de montar o cartão e caem no fallback de
      mostrar a URL crua. As tags que existiam estavam corretas, e a imagem
      responde 200 com 1200x630 de verdade — não era nada disso.

      Isso importa mais aqui do que na maioria dos sites: o link do WhatsApp é
      a porta de entrada do responsável, e é a primeira coisa que ele vê do
      produto. Link pelado, mandado por um motorista pedindo que ele clique,
      tem cara de golpe — e a pessoa não clica.

      O ENDEREÇO É FIXO, E ISSO É LIMITAÇÃO CONHECIDA
      Este é um SPA: existe um index.html só, e o robô não roda JavaScript.
      Então TODA rota compartilha estas tags — /familia, /convite/CODIGO e a
      home mostram o mesmo cartão. Preview por rota exigiria renderizar no
      servidor (rewrite do Hosting pra uma function), o que depende do plano
      Blaze. Enquanto não existir, o cartão genérico é melhor que cartão
      nenhum.
    -->
    <meta property="og:url" content="https://projeto-tio-nino-digital.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alô Buzinou" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Alô Buzinou — onde a perua está, agora" />
    <meta
      property="og:description"
      content="Rota em tempo real, avisos do motorista e mensalidade em dia. Sem grupo de WhatsApp e sem planilha."
    />
    <meta
      property="og:image"
      content="https://projeto-tio-nino-digital.web.app/brand/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alô Buzinou — transporte escolar em tempo real" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Alô Buzinou</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
